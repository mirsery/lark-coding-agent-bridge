name: CI

on:
  # Branch pushes only: a version tag runs this through release.yml instead.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  test:
    name: Node 20 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows is not blocking yet: the fork only runs on macOS, and its first CI
    # run found ~40 Windows-only failures (file modes, path separators, local
    # git remotes). Results still show up; drop this once they are fixed.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
